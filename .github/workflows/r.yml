name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find exact v0.4 ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 3 -type f -name 'Settlement-Survival-Game-v0.4.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Exact v0.4 ZIP not found."
            echo "ZIP files found:"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          mkdir -p build-project
          unzip -q "$ZIP_FILE" -d build-project

      - name: Find Android project
        shell: bash
        run: |
          set -e
          PROJECT_DIR=$(find build-project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Verify v0.4 project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          grep -q 'applicationId = "com.example.settlementsurvival"' app/build.gradle.kts
          grep -q 'versionCode = 4' app/build.gradle.kts
          grep -q 'versionName = "0.4"' app/build.gradle.kts
          echo "v0.4 project verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e
          mkdir -p output
          find "$PROJECT_DIR" -type f -name '*.apk' -exec cp {} output/ \;
          test -n "$(find output -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Settlement-Survival-v0.4-APK
          path: output/*.apk
          if-no-files-found: error
